services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventory-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: ./data/inventory.db
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRE: 7d
      DATABASE_URL: postgresql://inventory_user:change-me@db:5432/inventory_saas
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_replace_me}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_replace_me}
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    networks:
      - inventory-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  db:
    image: postgres:16-alpine
    container_name: inventory-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: inventory_saas
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - inventory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  inventory-network:
    driver: bridge

volumes:
  pgdata:
